version: '3.8'

services:
  patient_website:
    build: ./frontend/patient
    networks:
      - app-network
    #ports:
    #  - "3000:80"

  auth_service:
    build: 
      context: ./backend
      dockerfile: Services/AuthService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Connection string
      - ConnectionStrings__AuthDb=Host=postgres_db;Database=AuthServiceDb;Username=authservice_user;Password=authservice_pass
      # Token options (güvenlik için environment variable kullanılmalı)
      - TokenOptions__SecurityKey=${TOKEN_SECURITY_KEY:-MySuperSecretSecurityKey1234567890123456789012345678901234567890ABCDEF}
      - TokenOptions__Issuer=${TOKEN_ISSUER:-www.myapp.com}
      - TokenOptions__Audience=${TOKEN_AUDIENCE:-www.myapp.com}
      # PatientService path
      - PatientService__Path=http://patient_service:8080/api/Patients
    networks:
      - app-network

  patient_service:
    build:
      context: ./backend
      dockerfile: Services/PatientService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_ENVIRONMENT=Development
      # Connection string (appsettings.json'daki değeri override eder)
      - ConnectionStrings__PatientAppointmentDb=Host=postgres_db;Database=PatientAppointmentDb;Username=patientservice_user;Password=patientservice_pass
      # Logging configuration
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    networks:
      - app-network
  
  nginx_gateway:
    image: nginx:alpine3.23
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - patient_service
      - patient_website
    networks:
      - app-network

  postgres_db:
    image: postgres:18-alpine
    restart: always
    env_file: "infra/postgres/.env"
    # Development için gerekirse şu satırı ekleyebiliriz: ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
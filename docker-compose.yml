version: '3.8'

services:
  patient_website:
    build: ./frontend/patient
    ports:
      - "7000:80"

  auth_service:
    build: 
      context: ./backend
      dockerfile: Services/AuthService/Dockerfile
    ports:
      - "7001:8080"
  
  nginx_gateway:
    image: nginx:alpine3.23
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  postgres_db:
    image: postgres:18-alpine
    restart: always
    env_file: "infra/postgres/.env"
    ports:
      - "5432:5432"
    volumes:
      - ./infra/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    


worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;

    upstream auth_service    { server auth_service:8080; }
    upstream patient_service { server patient_service:8080; }
    upstream client          { server patient_website:80; }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /swagger/auth/ {
            rewrite ^/swagger/auth/(.*)$ /swagger/$1 break;
            proxy_pass http://auth_service;
        }
        location = /swagger/auth { return 301 /swagger/auth/; }

        location /swagger/patient/ {
            rewrite ^/swagger/patient/(.*)$ /swagger/$1 break;
            proxy_pass http://patient_service;
        }
        location = /swagger/patient { return 301 /swagger/patient/; }

        location /swagger/patient/v1/swagger.json {
            rewrite ^/swagger/patient/v1/swagger.json$ /swagger/v1/swagger.json break;
            proxy_pass http://patient_service;
        }

        location /api/auth {
            proxy_pass http://auth_service;
        }

        location ~* ^/api/(patients|appointments|appointment-slots|doctors|waitlists) {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://client;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}

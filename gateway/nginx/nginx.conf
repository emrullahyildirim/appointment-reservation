worker_processes 1; 

events {
    worker_connections 1024;
}

http {
    include       mime.types; 
    default_type  application/octet-stream;
    sendfile on;

    upstream auth_service {
        server auth_service:8080;
    }

    upstream patient_service {
        server patient_service:8080;
    }

    upstream client {
        server patient_website:80;
    }

    server {
        listen 80;
        server_name localhost;



# AUTH SERVICE SWAGGER
location /swagger/auth/ {
    rewrite ^/swagger/auth/(.*)$ /swagger/$1 break;
    proxy_pass http://auth_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /swagger/auth;
}

location /swagger/auth {
    return 301 /swagger/auth/;
}

# PATIENT SERVICE SWAGGER
location /swagger/patient/ {
    rewrite ^/swagger/patient/(.*)$ /swagger/$1 break;
    proxy_pass http://patient_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /swagger/patient;
}

location /swagger/patient {
    return 301 /swagger/patient/;
}

# PATIENT SERVICE SWAGGER JSON
location /swagger/patient/v1/swagger.json {
    rewrite ^/swagger/patient/v1/swagger.json$ /swagger/v1/swagger.json break;
    proxy_pass http://patient_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Case-insensitive matching for patients
        location ~* ^/api/patients {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Case-insensitive matching for appointments
        location ~* ^/api/appointments {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/appointment-slots {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Case-insensitive matching for doctors
        location ~* ^/api/doctors {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Case-insensitive matching for waitlists
        location ~* ^/api/waitlists {
            proxy_pass http://patient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}